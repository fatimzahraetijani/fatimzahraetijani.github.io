<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Elegant Minimalist Monochrome Monogram Icon -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#111111" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2"/>
    
    <!-- Stylized F -->
    <path d="M 14 13 L 26 13 M 14 13 L 14 31 M 14 21 L 23 21" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Interlocking Stylized T -->
    <path d="M 23 18 L 32 18 M 27.5 18 L 27.5 31" stroke="#CCCCCC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Accent Dot -->
    <circle cx="32" cy="31" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography: FATIM ZAHRAE TIJANI -->
  <g transform="translate(60, 26)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">
      FATIM ZAHRAE
    </text>
    <text y="17" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="3.5" fill="#AAAAAA">
      TIJANI
    </text>
  </g>
</svg>
